[package]
name = "pontus_onyx_cli"
[package.version]
workspace = true

[package.authors]
workspace = true

[package.edition]
workspace = true

[package.license]
workspace = true

[package.readme]
workspace = true

[package.repository]
workspace = true

[dependencies]
pontus_onyx = { path = "../lib", features = ["actix_server"] }
pontus_onyx_engine_filesystem = { path = "../engine_filesystem" }

actix-web = { version = "4.8.0", features = ["rustls"] }
log = "0.4.22"
rand = "0.8.5"
toml = "0.8.19"
serde = { version = "1.0.204", features = ["derive"] }
simplelog = "0.12.2"
serde_json = "1.0.122"
pct-str = "2.0.0"
time = { version = "0.3.36", features = ["serde-human-readable"] }
tera = "1.20.0"
rustls = "0.20.9"
rustls-pemfile = "1.0.4"
lol_html = "1.2.1"
tokio = "1.39.2"
serde-encrypt = "0.7.0"
dunce = "1.0.4"
zeroize = "1.8.1"
rpassword = "7.3.1"

[dev-dependencies]
pontus_onyx_engine_ram = { path = "../engine_ram" }

actix-http = "3.8.0"
tempfile = "3.11.0"
